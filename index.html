<title>Quarantine Deal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark card table. Other players' tables on top, yours below, your hand pinned to the bottom edge. One look, dark on purpose. */
:root{
  --bg:#141414; --surface:#1e1e1e; --ink:#f4f2ec; --muted:#a9a69d; --line:#3b3b3b;
  --accent:#2bb8a3; --accent-ink:#04201c; --alert:#ff7b6e;
  --display:'Zilla Slab','Rockwell','Georgia',serif;
  --body:'Jost','Century Gothic','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;padding-inline:16px;padding-block:18px 40px}
#app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tape{height:12px;margin-inline:-16px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--tape) 14px 28px)}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1;margin:0;letter-spacing:.01em}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.code{font-family:var(--display);font-weight:700;letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);padding:2px 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--surface);border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.turn{border-color:var(--accent);box-shadow:inset 0 5px 0 var(--accent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.btn{font:600 16px var(--body);padding:8px 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.btn.go:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:500 17px var(--body);padding:8px 10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
#f-code{width:7em;text-transform:uppercase;letter-spacing:.14em}
.notice{background:var(--surface);border:1.5px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px}
.notice .big{font-family:var(--display);font-size:23px;font-weight:700;text-wrap:balance}
.err{color:var(--alert);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--muted)}
.chips b{color:var(--ink);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{display:flex;flex-direction:column;gap:3px}
.set>span{font-size:13px;font-weight:700;letter-spacing:.04em}
.set.full>span::after{content:" \2713 full"}
.stack{display:flex;flex-wrap:wrap;gap:4px}
.hand{display:flex;flex-wrap:wrap;gap:8px}
.card{font-family:var(--body);background:var(--band);padding:5px;border:0;border-radius:12px;width:136px;display:flex;color:#f1efe8}
button.card{cursor:pointer}
button.card:hover{transform:translateY(-3px)}
.card .in{background:#242424;border-radius:8px;flex:1;min-width:0;min-height:184px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;position:relative;text-align:center}
.card .val{position:absolute;top:-5px;left:-5px;width:31px;height:31px;border-radius:50%;background:#242424;border:3px solid var(--tc);display:grid;place-items:center;font-weight:700;font-size:13px}
.card .lb{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#b9b6ad;padding-left:20px;min-height:14px}
.card .nm{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.02;color:var(--tc);text-transform:uppercase;overflow-wrap:anywhere}
.card .art{width:62px;height:62px;margin-block:auto;flex:none}
.card .ds{font-size:13px;line-height:1.2;margin-top:auto}
.card.money .nm{font-size:44px;margin-block:auto}
/* property and rent cards are filled with their set colour, so a rent card visibly matches the sets it charges for */
.card.solid .in{background:var(--band);color:#1b1b1b;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)}
.card.solid .nm,.card.solid .lb{color:#1b1b1b}
.card.solid .ds{font-weight:600}
.card.solid .val{border-color:#f1efe8;color:#f1efe8}
.lad{display:flex;flex-direction:column;gap:2px;margin-block:auto;width:100%;padding-inline:10px;font-weight:700;font-size:13px}
.lad span{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(0,0,0,.4)}
.or{margin-block:auto;background:#1b1b1b;color:#f1efe8;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 9px;border-radius:9px}
.card.sm .lad,.card.sm .or,.card.sm .or+.nm{display:none}
.card.sm{width:100px;border-radius:9px;padding:4px}
.card.sm .in{min-height:0;padding:5px 4px 6px;border-radius:6px}
.card.sm .nm{font-size:13.5px}
.card.sm .val{width:23px;height:23px;font-size:11px;border-width:2px}
.card.sm .art,.card.sm .ds{display:none}
.card.sm.money .nm{font-size:22px}
.card.sel{outline:4px solid var(--accent);outline-offset:1px;transform:translateY(-5px)}
.log{font-size:15px;color:var(--muted);max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.log div:first-child{color:var(--ink);font-weight:600}
.notice.play{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-height:55vh;overflow-y:auto;box-shadow:0 8px 16px rgba(0,0,0,.22)}
.zone{border:1.5px dashed var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
summary{cursor:pointer;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
details[open]>summary{margin-bottom:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--c);margin-left:5px;vertical-align:-1px}
.dot.on{background:var(--c)}
.spacer{height:256px}
.spacer.min{height:60px}
.handtab{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:36px;align-items:center;background:none;border:0;padding:0;cursor:pointer;font:700 14px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.handtab span:last-child{color:var(--ink)}
.handtab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.handbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--ink);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.handbar .hand{flex-wrap:nowrap;overflow-x:auto;padding:6px 2px 6px}
.handbar .card{flex:none;width:106px}
.handbar .card .in{min-height:150px;padding:7px 4px}
.handbar .card .nm{font-size:14px}
.handbar .card .lb{font-size:10px;letter-spacing:.04em}
.handbar .card .ds{font-size:11.5px}
.handbar .card .art{width:42px;height:42px}
.handbar .card.money .nm{font-size:36px}
[data-drag]{touch-action:pan-x;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.lifting{opacity:.25}
body.dragging [data-drop]{outline:2px dashed var(--accent);outline-offset:-3px}
body.dragging [data-drop].over{outline-style:solid;outline-width:4px;box-shadow:inset 0 0 0 999px rgba(43,184,163,.22)}
body.dragging{user-select:none;-webkit-user-select:none}
@media (max-width:560px){
  body{font-size:16px}
  #app{gap:14px}
  .panel,.notice{padding:10px}
  .notice .big{font-size:18px}
  .btn{min-height:44px}
  .notice .row .btn{flex:1 1 auto}
  .stack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stack .card{width:auto}
  .sets{flex-direction:column}
  .card .in{min-height:160px;padding:7px 4px}
  .card.sm .in{min-height:0}
  .card .nm{font-size:14px}
  .card .lb{font-size:10px;letter-spacing:.04em}
  .card.sm .nm{font-size:12.5px}
  .card .ds{font-size:12px}
  .card .art{width:46px;height:46px}
  .card.money .nm{font-size:38px}
  .card.sm.money .nm{font-size:20px}
}
ul{margin:0;padding-left:20px;max-width:65ch}
li{margin-block:3px}
@media (prefers-reduced-motion:reduce){button.card:hover,.card.sel{transform:none}}
</style>

<script>
/*ENGINE*/
const SETS={
  pantry:{n:'Pantry',size:2,rent:[1,2],val:1,col:'#c08a62',ink:'#fff',cards:['Canned Beans','Instant Noodles']},
  office:{n:'Home Office',size:3,rent:[1,2,3],val:1,col:'#8ccdec',ink:'#102a36',cards:['Kitchen Table Desk','Couch Office','Ironing Board Desk']},
  hobbies:{n:'New Hobbies',size:3,rent:[1,2,4],val:2,col:'#e79cc0',ink:'#3a1026',cards:['Sourdough Starter','Banana Bread','1000-Piece Puzzle']},
  streaming:{n:'Binge List',size:3,rent:[1,3,5],val:2,col:'#f0903f',ink:'#331703',cards:['True Crime Docuseries','Baking Show','Sitcom Rewatch']},
  essentials:{n:'Essentials',size:3,rent:[2,3,6],val:3,col:'#f0605a',ink:'#fff',cards:['Toilet Paper','Hand Sanitizer','Disinfecting Wipes']},
  outdoors:{n:'Fresh Air',size:3,rent:[2,4,6],val:3,col:'#f1d040',ink:'#322a02',cards:['Balcony','Backyard','Walk Around the Block']},
  fitness:{n:'Home Gym',size:3,rent:[2,4,7],val:4,col:'#4fb873',ink:'#fff',cards:['Yoga Mat','Dumbbells','Stationary Bike']},
  lab:{n:'Clinic',size:2,rent:[3,8],val:4,col:'#6d8ff0',ink:'#fff',cards:['Test Kits','Vaccine Appointment']},
  delivery:{n:'Deliveries',size:4,rent:[1,2,3,4],val:2,col:'#a3acb7',ink:'#fff',cards:['Grocery Delivery','Takeout','Parcel Drop','Pharmacy Run']},
  wifi:{n:'Connection',size:2,rent:[1,2],val:2,col:'#bccb6c',ink:'#262c08',cards:['Wi-Fi Router','Webcam']}
};
// name, effect, value, copies, frame colour, face
const ACTIONS={
  draw:['Costco Run','Draw 2 extra cards.',1,10,'#f5a94a','happy'],
  bday:['I\'ve Recovered','Everyone pays you 2M.',2,3,'#f08ac0','happy'],
  debt:['Contract Covid','One player pays you 5M.',3,3,'#35b59c','angry'],
  sly:['Close Business','Take one property that is not in a full set.',3,3,'#a08d84','cool'],
  swap:['Close Schools','Swap one of your properties for one of theirs. No full sets.',3,3,'#c9c9c9','happy'],
  breaker:['Close Borders','Take a full set from a player.',5,2,'#c08af5','angry'],
  nope:['No! I\'m in Quarantine','Cancel an action played against you.',4,3,'#5b8cf0','angry'],
  double:['SBA Loan','Play with a Rent card to double it.',1,2,'#e6cc5a','cool'],
  house:['Toilet Paper Stash','Add to a full set for 3M more rent.',3,3,'#74b3b0','happy'],
  hotel:['Social Distancing','Add to a full set for 4M more rent.',4,2,'#5cba6e','happy'],
  peek:['Share Screen','See one player\'s hand for 10 seconds.',3,2,'#52b0e0','cool'],
  handswap:['Cross Contaminate','Trade a card from your hand for a random card from theirs.',2,2,'#f47a72','sad'],
  retrieve:['False Positive','Take back one of the last three action cards played.',1,2,'#c5cc3f','happy'],
  nodraw:['Delayed Shipment','One player draws nothing on their next turn.',2,2,'#f07a45','sad'],
  redraw:['Work From Home','One player discards their hand and draws the same number.',1,2,'#b0603f','sad']
};
const CARDS=(function(){
  const C=[],add=(n,c)=>{for(let i=0;i<n;i++)C.push(Object.assign({id:C.length},c));};
  [[1,6],[2,5],[3,3],[4,3],[5,2],[10,1]].forEach(([v,n])=>add(n,{k:'money',val:v,name:String(v)}));
  for(const s in SETS)SETS[s].cards.forEach(nm=>add(1,{k:'prop',set:s,name:nm,val:SETS[s].val}));
  [['lab','fitness',4],['office','pantry',1],['hobbies','streaming',2],['hobbies','streaming',2],['essentials','outdoors',3],
   ['essentials','outdoors',3],['fitness','delivery',4],['office','delivery',4],['wifi','delivery',2]]
    .forEach(([a,b,v])=>add(1,{k:'wild',sets:[a,b],val:v,name:'Flex Space'}));
  add(2,{k:'wild',sets:null,val:0,name:'Spare Room'});
  [['lab','fitness'],['essentials','outdoors'],['hobbies','streaming'],['office','pantry'],['wifi','delivery']]
    .forEach(p=>add(2,{k:'rent',sets:p,val:1,name:'Rent'}));
  add(3,{k:'rent',sets:null,val:3,name:'Rent'});
  for(const a in ACTIONS)add(ACTIONS[a][3],{k:'action',act:a,name:ACTIONS[a][0],val:ACTIONS[a][2]});
  return C;
})();
const HAND_LIMIT=7;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pname(g,p){const x=g.players.find(q=>q.id===p);return x?x.name:'Someone';}
function count(g,p,s){return g.props[p].filter(x=>x.color===s).length;}
function complete(g,p){return Object.keys(SETS).filter(s=>count(g,p,s)>=SETS[s].size);}
function colours(g,p){return Object.keys(SETS).filter(s=>count(g,p,s)).length;}
function rentFor(g,p,s){const c=count(g,p,s);if(!c)return 0;let r=SETS[s].rent[Math.min(c,SETS[s].size)-1];
  if(c>=SETS[s].size)g.ups[p].forEach(u=>{if(u.color===s)r+=CARDS[u.id].val;});return r;}
function payables(g,p){return g.bank[p].concat(g.props[p].map(x=>x.id).filter(id=>CARDS[id].val>0),g.ups[p].map(u=>u.id));}
function stealable(g,p){return g.props[p].filter(x=>count(g,p,x.color)<SETS[x.color].size);}
function actorOf(g){if(g.status!=='playing')return null;const q=g.pending;return q?(q.nope%2===0?q.queue[0]:q.from):g.order[g.turn];}
function validColor(c,s){if(!SETS[s])return false;return c.k==='prop'?c.set===s:c.k==='wild'&&(!c.sets||c.sets.includes(s));}
function take(arr,id){const i=arr.indexOf(id);if(i<0)return false;arr.splice(i,1);return true;}
function say(g,t){g.log.unshift(t);if(g.log.length>40)g.log.length=40;}
function draw(g,p,n){for(let i=0;i<n;i++){if(!g.deck.length){g.deck=shuffle(g.discard);g.discard=[];}if(!g.deck.length)break;g.hands[p].push(g.deck.pop());}}
function startTurn(g){const p=g.order[g.turn];g.plays=0;
  if(g.skip[p]){g.skip[p]=false;say(g,pname(g,p)+' has a delayed shipment and draws nothing.');}else draw(g,p,g.hands[p].length?2:5);}
function played(g,id,p){g.played.push(id);if(g.played.length>3)g.played.shift();g.last[p]=id;}
function nextTurn(g){g.pending=null;g.turn=(g.turn+1)%g.order.length;startTurn(g);}
function newGame(players,host){
  const g={status:'playing',host:host,v:1,players:players,order:players.map(p=>p.id),turn:0,plays:0,
    deck:shuffle(CARDS.map(c=>c.id)),discard:[],hands:{},bank:{},props:{},ups:{},skip:{},last:{},played:[],peek:null,pending:null,log:[],winner:null};
  g.order.forEach(p=>{g.hands[p]=[];g.bank[p]=[];g.props[p]=[];g.ups[p]=[];g.skip[p]=false;draw(g,p,5);});
  say(g,'Cards dealt. '+pname(g,g.order[0])+' goes first.');
  startTurn(g);return g;
}
function settle(g){
  const q=g.pending;
  if(q){
    while(q.queue.length&&q.type==='pay'&&q.nope===0&&!payables(g,q.queue[0]).length){say(g,pname(g,q.queue[0])+' has nothing to pay with.');q.queue.shift();}
    if(!q.queue.length)g.pending=null;
  }
  for(let i=0;i<g.order.length;i++){const p=g.order[(g.turn+i)%g.order.length];
    const how=complete(g,p).length>=3?'three full sets':colours(g,p)>=Object.keys(SETS).length?'a property in all ten colours':null;
    if(how){g.status='over';g.winner=p;g.how=how;g.pending=null;say(g,pname(g,p)+' wins with '+how+'.');return;}}
}
function applyEffect(g,q,t){
  const mv=(from,to,id)=>{const i=g.props[from].findIndex(x=>x.id===id);if(i>=0)g.props[to].push(g.props[from].splice(i,1)[0]);};
  if(q.type==='sly')mv(t,q.from,q.take);
  if(q.type==='swap'){mv(t,q.from,q.take);mv(q.from,t,q.give);}
  if(q.type==='breaker'){g.props[t].filter(x=>x.color===q.color).map(x=>x.id).forEach(id=>mv(t,q.from,id));
    g.ups[t].filter(u=>u.color===q.color).forEach(u=>g.ups[q.from].push(u));g.ups[t]=g.ups[t].filter(u=>u.color!==q.color);}
  if(q.type==='peek')g.peek={by:q.from,target:t,n:Math.floor(Math.random()*1e9)};
  if(q.type==='nodraw')g.skip[t]=true;
  if(q.type==='redraw'){const n=g.hands[t].length;g.discard.push(...g.hands[t]);g.hands[t]=[];draw(g,t,n);}
  if(q.type==='handswap'&&g.hands[t].length){const got=g.hands[t][Math.floor(Math.random()*g.hands[t].length)];
    if(take(g.hands[q.from],q.give)){take(g.hands[t],got);g.hands[t].push(q.give);g.hands[q.from].push(got);}}
}
// Applies one action for player `me` to game `g` in place. Returns an error message, or null when it worked.
function act(g,me,a){
  if(g.status!=='playing')return 'The game is not running.';
  if(a.t==='skip'){if(me!==g.host)return 'Only the host can skip.';say(g,'The host skipped '+pname(g,actorOf(g))+'.');nextTurn(g);return null;}
  if(actorOf(g)!==me)return 'It is not your move.';
  const q=g.pending,hand=g.hands[me],who=pname(g,me);
  if(q){
    if(a.t!=='respond')return 'Answer the action first.';
    const t=q.queue[0];
    if(a.r==='nope'){
      const id=hand.find(i=>CARDS[i].act==='nope');if(id==null)return 'You have no No! I\'m in Quarantine card.';
      take(hand,id);g.discard.push(id);played(g,id,me);q.nope++;say(g,who+' played No! I\'m in Quarantine.');return null;
    }
    if(q.nope%2===1){say(g,who+' let it go.');}
    else if(q.type==='pay'){
      const ids=a.pay||[],can=payables(g,me);
      if(new Set(ids).size!==ids.length||!ids.every(i=>can.includes(i)))return 'Pay with cards from your stockpile or properties.';
      const sum=ids.reduce((s,i)=>s+CARDS[i].val,0);
      if(sum<q.amount&&ids.length<can.length)return 'That does not cover '+q.amount+'.';
      ids.forEach(id=>{const u=g.ups[me].findIndex(x=>x.id===id);if(u>=0){g.ups[me].splice(u,1);g.bank[q.from].push(id);}else if(take(g.bank[me],id))g.bank[q.from].push(id);else{const i=g.props[me].findIndex(x=>x.id===id);g.props[q.from].push(g.props[me].splice(i,1)[0]);}});
      say(g,who+' paid '+pname(g,q.from)+' '+sum+'.');
    }else{applyEffect(g,q,t);say(g,who+' accepted.');}
    q.queue.shift();q.nope=0;settle(g);return null;
  }
  if(a.t==='end'){
    const d=a.discard||[],over=Math.max(0,hand.length-HAND_LIMIT);
    if(d.length!==over||new Set(d).size!==d.length||!d.every(i=>hand.includes(i)))return 'Discard '+over+' card'+(over===1?'':'s')+' to end your turn.';
    d.forEach(i=>{take(hand,i);g.discard.push(i);});
    nextTurn(g);say(g,pname(g,g.order[g.turn])+"'s turn.");return null;
  }
  if(a.t==='recolor'){
    const x=g.props[me].find(p=>p.id===a.card);
    if(!x||CARDS[x.id].k!=='wild'||!validColor(CARDS[x.id],a.color))return 'That card cannot move there.';
    x.color=a.color;settle(g);return null;
  }
  const c=CARDS[a.card];
  if(!c||!hand.includes(a.card))return 'That card is not in your hand.';
  if(g.plays>=3)return 'You have already played 3 cards.';
  const others=g.order.filter(p=>p!==me);
  if(a.t==='bank'){
    if(c.k==='prop'||c.k==='wild')return 'Properties cannot go in the stockpile.';
    take(hand,c.id);g.bank[me].push(c.id);g.plays++;say(g,who+' stockpiled '+c.val+'.');return null;
  }
  if(a.t==='prop'){
    if(!validColor(c,a.color))return 'Pick a set for that card.';
    take(hand,c.id);g.props[me].push({id:c.id,color:a.color});g.plays++;
    say(g,who+' put down '+c.name+' ('+SETS[a.color].n+').');settle(g);return null;
  }
  if(a.t!=='play')return 'Unknown move.';
  const isOther=p=>others.includes(p);
  if(c.k==='rent'){
    const s=a.color;
    if(!SETS[s]||(c.sets&&!c.sets.includes(s))||!count(g,me,s))return 'Pick a set you own for this bill.';
    if(!c.sets&&!isOther(a.target))return 'Pick who gets the bill.';
    let amt=rentFor(g,me,s),dbl=null;
    if(a.double){dbl=hand.find(i=>CARDS[i].act==='double');if(dbl==null||g.plays>1)return 'You cannot add SBA Loan now.';amt*=2;}
    take(hand,c.id);g.discard.push(c.id);played(g,c.id,me);g.plays++;
    if(dbl!=null){take(hand,dbl);g.discard.push(dbl);g.plays++;}
    g.pending={type:'pay',from:me,queue:c.sets?others.slice():[a.target],amount:amt,nope:0};
    say(g,who+' sent a bill of '+amt+' for '+SETS[s].n+(c.sets?' to everyone.':' to '+pname(g,a.target)+'.'));
  }else if(c.k==='action'){
    let p=null;
    if(c.act==='draw'){draw(g,me,2);say(g,who+' made a Costco Run and drew 2.');}
    else if(c.act==='bday'){p={type:'pay',from:me,queue:others.slice(),amount:2,nope:0};say(g,who+' has recovered. Everyone owes 2.');}
    else if(c.act==='debt'){if(!isOther(a.target))return 'Pick a player.';p={type:'pay',from:me,queue:[a.target],amount:5,nope:0};say(g,who+' is collecting 5 from '+pname(g,a.target)+'.');}
    else if(c.act==='sly'){
      if(!isOther(a.target)||!stealable(g,a.target).some(x=>x.id===a.take))return 'Pick a property that is not in a full set.';
      p={type:'sly',from:me,queue:[a.target],take:a.take,nope:0};say(g,who+' is taking '+CARDS[a.take].name+' from '+pname(g,a.target)+'.');
    }else if(c.act==='swap'){
      if(!isOther(a.target)||!stealable(g,a.target).some(x=>x.id===a.take)||!stealable(g,me).some(x=>x.id===a.give))return 'Pick one of theirs and one of yours, neither in a full set.';
      p={type:'swap',from:me,queue:[a.target],take:a.take,give:a.give,nope:0};
      say(g,who+' wants to swap '+CARDS[a.give].name+' for '+pname(g,a.target)+"'s "+CARDS[a.take].name+'.');
    }else if(c.act==='breaker'){
      if(!isOther(a.target)||!complete(g,a.target).includes(a.color))return 'Pick a full set.';
      p={type:'breaker',from:me,queue:[a.target],color:a.color,nope:0};say(g,who+' closed the borders on '+pname(g,a.target)+"'s "+SETS[a.color].n+' set.');
    }else if(c.act==='house'||c.act==='hotel'){
      if(!complete(g,me).includes(a.color)||g.ups[me].some(u=>u.color===a.color&&CARDS[u.id].act===c.act))return 'Pick one of your full sets that does not have this upgrade.';
      take(hand,c.id);g.ups[me].push({id:c.id,color:a.color});g.plays++;say(g,who+' added '+c.name+' to '+SETS[a.color].n+'.');return null;
    }else if(c.act==='retrieve'){
      if(!g.played.includes(a.pick)||!g.discard.includes(a.pick))return 'Pick one of the last three action cards played.';
      take(g.discard,a.pick);take(g.played,a.pick);hand.push(a.pick);say(g,who+' took '+CARDS[a.pick].name+' back from the discards.');
    }else if(c.act==='peek'||c.act==='nodraw'||c.act==='redraw'){
      if(!isOther(a.target))return 'Pick a player.';
      p={type:c.act,from:me,queue:[a.target],nope:0};say(g,who+' played '+c.name+' on '+pname(g,a.target)+'.');
    }else if(c.act==='handswap'){
      if(!isOther(a.target)||!g.hands[a.target].length||a.give===c.id||!hand.includes(a.give))return 'Pick a player with cards and a card of yours to give.';
      p={type:'handswap',from:me,queue:[a.target],give:a.give,nope:0};say(g,who+' is trading a card with '+pname(g,a.target)+'.');
    }else return 'That card only works as a reply or with a bill.';
    take(hand,c.id);
    g.discard.push(c.id);played(g,c.id,me);g.plays++;g.pending=p;
  }else return 'That card cannot be played that way.';
  settle(g);return null;
}
/*END*/

const RAINBOW='linear-gradient(90deg,#f0605a,#f0903f,#f1d040,#4fb873,#6d8ff0,#e79cc0)',PALE='#f1efe8';
function germ(col,mood){
  let n='';for(let i=0;i<8;i++){const a=i*Math.PI/4+.3,x=(32+Math.cos(a)*26).toFixed(1),y=(32+Math.sin(a)*26).toFixed(1);

  const eyes=mood==='cool'?'<rect x="19" y="24" width="26" height="9" rx="3" fill="#1b1b1b"/>':'<circle cx="25" cy="29" r="3" fill="#1b1b1b"/><circle cx="39" cy="29" r="3" fill="#1b1b1b"/>';
  const face={happy:'<path d="M24 37q8 8 16 0"/>',sad:'<path d="M24 42q8-7 16 0"/><path d="M20 23l8-3M44 23l-8-3"/>',angry:'<path d="M25 40h14"/><path d="M20 21l9 4M44 21l-9 4"/>',cool:'<path d="M26 39q6 4 12 0"/>'}[mood];
  return '<svg class="art" viewBox="0 0 64 64" aria-hidden="true">'+n+'<circle cx="32" cy="32" r="19" fill="'+col+'"/>'+eyes+'<g fill="none" stroke="#1b1b1b" stroke-width="2.5" stroke-linecap="round">'+face+'</g></svg>';
}
function cardHTML(id,o){
  o=o||{};const c=CARDS[id];let band='#cfc9b4',tc=PALE,label='',ds='',mid='',name=c.name;
  const solid=c.k==='prop'||c.k==='wild'||c.k==='rent';
  // two-set cards are split top and bottom, one colour per set
  const two=s=>'linear-gradient(180deg,'+SETS[s[0]].col+' 50%,'+SETS[s[1]].col+' 50%)';
  const ladder=s=>'<span class="lad">'+SETS[s].rent.map((r,i)=>'<span><b>'+(i+1)+'</b>'+r+'M</span>').join('')+'</span>';
  const half=(word,s)=>'<span class="or">'+word+'</span><span class="nm">'+esc(SETS[s].n)+'</span>';
  if(c.k==='money'){label='Masks';name=c.val+'M';ds='Stockpile it to pay rent.';}
  else if(c.k==='prop'){band=SETS[c.set].col;label=SETS[c.set].n;mid=ladder(c.set);}
  else if(c.k==='wild'){
    if(o.color){band=SETS[o.color].col;label=SETS[o.color].n;name='Wild';mid=ladder(o.color);}
    else if(c.sets){band=two(c.sets);label='Wild property';name=SETS[c.sets[0]].n;mid=half('or',c.sets[1]);ds='Goes in either set. Move it later if you like.';}
    else{band=RAINBOW;label='Wild property';name='Any set';mid=germ(PALE,'cool');ds='Goes in any set. Move it later if you like.';}
  }else if(c.k==='rent'){
    if(c.sets){band=two(c.sets);label='Rent · all players';name=SETS[c.sets[0]].n;mid=half('rent',c.sets[1]);ds='Everyone pays you rent on one of these.';}
    else{band=RAINBOW;label='Rent · one player';name='Any set';mid=germ(PALE,'angry');ds='One player pays you rent on any set you own.';}
  }else{const A=ACTIONS[c.act];band=tc=A[4];label=c.act==='house'||c.act==='hotel'?'Upgrade':'Action';ds=A[1];mid=germ(tc,A[5]);}
  const tag=o.fn?'button':'div';
  return '<'+tag+' class="card '+(c.k==='money'?'money ':'')+(solid?'solid ':'')+(o.sm?'sm ':'')+(o.sel?'sel':'')+'" '+(o.fn?on(o.fn):'')+(o.attr||'')+

    '<span class="lb">'+esc(label)+'</span><span class="nm">'+esc(name)+'</span>'+mid+'<span class="ds">'+esc(ds)+'</span></span></'+tag+'>';
}

function pendingText(g){

function controls(g){
  const q=g.pending,hand=g.hands[me]||[],actor=actorOf(g),out=[];
  if(g.status==='over')return (g.host===me?btn('Play again',againGame,'go'):'')+btn('Leave table',leaveTable);
  if(!g.order.includes(me))return '<p class="muted">You are watching this game.</p>'+btn('Leave table',leaveTable);
  if(actor!==me)return '<p class="muted">Waiting for '+esc(pname(g,actor))+'…</p>'+(g.host===me?btn('Skip '+pname(g,actor),()=>commit({t:'skip'})):'');
  const hasNope=hand.some(i=>CARDS[i].act==='nope');
  if(q){
    if(q.nope%2===1){out.push(btn('Let it go',()=>commit({t:'respond',r:'ok'}),'go'));}
    else if(q.type==='pay'){
      const can=payables(g,me),sum=total([...ui.pay]),ok=sum>=q.amount||ui.pay.size===can.length;
      out.push('<p>Tap cards in your stockpile or properties to pay. Selected: <b>'+sum+'</b> of '+q.amount+'.</p>');
      out.push(btn(sum>=q.amount?'Pay '+sum:ok?'Pay everything you have':'Pay',()=>commit({t:'respond',r:'ok',pay:[...ui.pay]}),'go',!ok));
    }else out.push(btn('Accept',()=>commit({t:'respond',r:'ok'}),'go'));
    if(hasNope)out.push(btn(q.nope%2?'Counter with No! I\'m in Quarantine':'Play No! I\'m in Quarantine',()=>commit({t:'respond',r:'nope'})));
    return out.join('');
  }
  const left=3-g.plays,over=hand.length-HAND_LIMIT;
  if(ui.disc){
    out.push('<p>Tap '+over+' card'+(over===1?'':'s')+' in your hand to discard.</p>');
    out.push(btn('Discard and end turn',()=>commit({t:'end',discard:[...ui.disc]}),'go',ui.disc.size!==over));
    out.push(btn('Keep playing',()=>{ui.disc=null;render();}));
    return out.join('');
  }
  if(ui.recolor!=null){
    const c=CARDS[ui.recolor];
    out.push('<p>Move this wild card to:</p>');
    (c.sets||Object.keys(SETS)).forEach(s=>out.push(btn(SETS[s].n,()=>commit({t:'recolor',card:c.id,color:s}))));
    return out.join('');
  }
  if(ui.sel!=null&&left>0)out.push(sheet(g,CARDS[ui.sel])+btn('Cancel',()=>{resetSel();render();}));
  else if(left>0)out.push('<p class="muted">Drag a card from your hand onto a table: your own for properties and stockpile, another player\'s to hit them, or here for other actions.</p>');
  out.push(btn('End turn',()=>{if(over>0){ui.sel=null;ui.handMin=false;ui.disc=new Set();render();}else commit({t:'end'});},left>0&&ui.sel!=null?'':'go'));
  return out.join('');
}
function sheet(g,c){
  const out=[],id=c.id,others=g.order.filter(p=>p!==me&&(!ui.step.target||p===ui.step.target)),left=3-g.plays;
  const play=x=>commit(Object.assign({t:'play',card:id},x));
  if(c.k==='prop')out.push(btn('Put down '+c.name,()=>commit({t:'prop',card:id,color:c.set}),'go'));
  else if(c.k==='wild'){out.push('<p>Put it down as:</p>');(c.sets||Object.keys(SETS)).forEach(s=>out.push(btn(SETS[s].n,()=>commit({t:'prop',card:id,color:s}),'go')));}
  else if(c.k==='rent'){
    const owned=(c.sets||Object.keys(SETS)).filter(s=>count(g,me,s));
    const canDbl=left>=2&&g.hands[me].some(i=>CARDS[i].act==='double');
    if(!owned.length)out.push('<p class="muted">You need a property in a matching set to send this bill.</p>');
    if(canDbl&&owned.length)out.push(btn(ui.step.double?'SBA Loan: on (uses 2 plays)':'Add SBA Loan',()=>{ui.step.double=!ui.step.double;render();}));
    owned.forEach(s=>{const amt=rentFor(g,me,s)*(ui.step.double?2:1);
      if(c.sets)out.push(btn('Bill everyone '+amt+' for '+SETS[s].n,()=>play({color:s,double:!!ui.step.double}),'go'));
      else others.forEach(p=>out.push(btn('Bill '+pname(g,p)+' '+amt+' for '+SETS[s].n,()=>play({color:s,target:p,double:!!ui.step.double}),'go')));});
  }else if(c.act==='draw')out.push(btn('Cash it: draw 2 cards',()=>play({}),'go'));
  else if(c.act==='bday')out.push(btn('Everyone pays you 2',()=>play({}),'go'));
  else if(c.act==='debt')others.forEach(p=>out.push(btn('Collect 5 from '+pname(g,p),()=>play({target:p}),'go')));
  else if(c.act==='sly'||c.act==='swap'){
    const theirs=[];others.forEach(p=>stealable(g,p).forEach(x=>theirs.push({p:p,x:x})));
    if(!theirs.length)out.push('<p class="muted">Nobody has a property outside a full set.</p>');
    else if(c.act==='sly')theirs.forEach(o=>out.push(btn('Take '+CARDS[o.x.id].name+' from '+pname(g,o.p),()=>play({target:o.p,take:o.x.id}),'go')));
    else if(!ui.step.take){out.push('<p>Which card do you want?</p>');theirs.forEach(o=>out.push(btn(CARDS[o.x.id].name+' ('+pname(g,o.p)+')',()=>{ui.step.take=o;render();})));}
    else{const mine=stealable(g,me);
      out.push(mine.length?'<p>Give which of yours for '+esc(CARDS[ui.step.take.x.id].name)+'?</p>':'<p class="muted">You have no property outside a full set to give.</p>');
      mine.forEach(x=>out.push(btn(CARDS[x.id].name+' ('+SETS[x.color].n+')',()=>play({target:ui.step.take.p,take:ui.step.take.x.id,give:x.id}),'go')));}
  }else if(c.act==='breaker'){
    let any=false;others.forEach(p=>complete(g,p).forEach(s=>{any=true;out.push(btn('Take '+pname(g,p)+"'s "+SETS[s].n+' set',()=>play({target:p,color:s}),'go'));}));
    if(!any)out.push('<p class="muted">Nobody has a full set yet.</p>');
  }else if(c.act==='house'||c.act==='hotel'){
    const ok=complete(g,me).filter(s=>!g.ups[me].some(u=>u.color===s&&CARDS[u.id].act===c.act));
    if(!ok.length)out.push('<p class="muted">You need a full set without this upgrade.</p>');
    ok.forEach(s=>out.push(btn('Add to '+SETS[s].n+' (+'+c.val+' rent)',()=>play({color:s}),'go')));
  }else if(c.act==='peek'||c.act==='nodraw'||c.act==='redraw')others.forEach(p=>out.push(btn(c.name+': '+pname(g,p),()=>play({target:p}),'go')));
  else if(c.act==='handswap'){
    const give=g.hands[me].filter(i=>i!==id),who=others.filter(p=>g.hands[p].length);
    if(!give.length||!who.length)out.push('<p class="muted">You and another player both need a card to trade.</p>');
    else if(!ui.step.target)who.forEach(p=>out.push(btn('Trade with '+pname(g,p),()=>{ui.step.target=p;render();})));
    else{out.push('<p>Give which card?</p>');give.forEach(i=>out.push(btn(CARDS[i].name+(CARDS[i].k==='money'?'M':''),()=>play({target:ui.step.target,give:i}),'go')));}
  }else if(c.act==='retrieve'){
    const got=g.played.filter(i=>g.discard.includes(i));
    if(!got.length)out.push('<p class="muted">No action cards have been played recently.</p>');
    got.forEach(i=>out.push(btn('Take back '+CARDS[i].name,()=>play({pick:i}),'go')));
  }else if(c.act==='nope')out.push('<p class="muted">Keep this to cancel an action played against you.</p>');
  else out.push('<p class="muted">Play this together with a Rent card.</p>');
  if(c.k!=='prop'&&c.k!=='wild')out.push(btn('Stockpile it as '+c.val,()=>commit({t:'bank',card:id})));
  return out.join('');
}
function vTable(){
  const g=game,inGame=g.order.includes(me),actor=actorOf(g),turnP=g.order[g.turn];
  const myTurn=inGame&&actor===me&&!g.pending&&g.status==='playing';
  const paying=inGame&&actor===me&&g.pending&&g.pending.type==='pay'&&g.pending.nope%2===0;
  const big=g.status==='over'?pname(g,g.winner)+' wins with '+(g.how||'three full sets')+'.':
    g.pending?pendingText(g):myTurn?'Your turn. '+(3-g.plays)+' play'+(3-g.plays===1?'':'s')+' left.':pname(g,turnP)+"'s turn.";
  const togglePay=id=>()=>{ui.pay.has(id)?ui.pay.delete(id):ui.pay.add(id);render();};
  const table=p=>{
    const mineT=p===me,bank=g.bank[p].slice().sort((a,b)=>CARDS[b].val-CARDS[a].val);
    const dots=Object.keys(SETS).filter(s=>count(g,p,s)).map(s=>'<i class="dot'+(count(g,p,s)>=SETS[s].size?' on':'')+'" style="--c:'+SETS[s].col+'"></i>').join('');
    const fn=mineT?x=>paying&&CARDS[x.id].val>0?togglePay(x.id):myTurn&&CARDS[x.id].k==='wild'&&!ui.disc?()=>{ui.recolor=ui.recolor===x.id?null:x.id;ui.sel=null;render();}:null:null;
    return '<section class="panel'+(actor===p?' turn':'')+'" data-drop="player:'+p+'">'+
      '<h2>'+(mineT?'Your table':esc(pname(g,p)))+' · '+complete(g,p).length+' of 3 sets · '+colours(g,p)+' of 10 colours</h2>'+
      (mineT?'':'<div class="chips"><span>Cards in hand <b>'+g.hands[p].length+'</b></span></div>')+
      '<div class="zone" data-drop="bank:'+p+'"><h2>Stockpile · '+total(bank)+'</h2>'+
        (bank.length?'<div class="stack">'+bank.map(i=>cardHTML(i,{sm:true,fn:mineT&&paying?togglePay(i):null,sel:ui.pay.has(i)})).join('')+'</div>':'<p class="muted">'+(mineT?'Drop masks and spare action cards here.':'Empty.')+'</p>')+'</div>'+
      '<div class="zone" data-drop="props:'+p+'"><h2>Properties · '+g.props[p].length+dots+'</h2>'+
        (g.props[p].length?setsHTML(g,p,fn,mineT&&myTurn&&!ui.disc):'<p class="muted">'+(mineT?'Drop property cards here.':'None yet.')+'</p>')+'</div></section>';
  };
  let handbar='';
  if(inGame&&g.status==='playing'){
    const hand=g.hands[me],canDrag=myTurn&&!ui.disc;
    handbar='<div class="spacer'+(ui.handMin?' min':'')+'"></div><div class="handbar"><button class="handtab" '+on(()=>{ui.handMin=!ui.handMin;render();})+' aria-expanded="'+!ui.handMin+'"><span>Your hand · '+hand.length+(canDrag&&!ui.handMin?' · drag a card up to play it':'')+'</span><span>'+(ui.handMin?'Show ▲':'Hide ▼')+'</span></button><div class="hand"'+(ui.handMin?' hidden':'')+'>'+hand.map(i=>cardHTML(i,{
      sel:ui.sel===i||(ui.disc&&ui.disc.has(i)),attr:canDrag?' data-drag="'+i+'"':'',
      fn:ui.disc?()=>{ui.disc.has(i)?ui.disc.delete(i):ui.disc.add(i);render();}:myTurn?()=>{ui.sel=ui.sel===i?null:i;ui.recolor=null;ui.step={};render();}:null})).join('')+'</div></div>';
  }
  return '<header><h1>Quarantine Deal</h1><p>Table <span class="code">'+esc(code)+'</span></p>'+
    '<div class="chips"><span>Deck <b>'+g.deck.length+'</b></span><span>Discards <b>'+g.discard.length+'</b></span></div></header>'+
    '<div class="notice play" data-drop="pile"><p class="big">'+esc(big)+'</p><div class="row">'+controls(g)+'</div>'+(ui.msg?'<p class="err">'+esc(ui.msg)+'</p>':'')+'</div>'+
    peekHTML(g)+'<div class="grid">'+g.order.filter(p=>p!==me).map(table).join('')+'</div>'+(inGame?table(me):'')+
    '<div class="col"><h2>What happened</h2><div class="log">'+g.log.slice(0,14).map(l=>'<div>'+esc(l)+'</div>').join('')+'</div></div>'+handbar;
}
// A hand card was dropped on a zone. Play it outright when the drop says everything; otherwise open the chooser for what is left to decide.
function dropCard(id,drop){
  const g=game,c=CARDS[id];if(!g||!g.hands[me]||!g.hands[me].includes(id))return;
  const d=drop.split(':'),z=d[0],p=d[1],x=d[2],onMe=p===me,target=p&&!onMe?p:null;
  const play=o=>commit(Object.assign({t:'play',card:id},o));
  const ask=step=>{ui.sel=id;ui.recolor=null;ui.step=step||{};ui.msg='';render();};
  if(c.k==='prop'||c.k==='wild'){
    if(target)return flash('Properties go on your own table.');
    if(c.k==='prop')return commit({t:'prop',card:id,color:c.set});
    if((z==='set'||z==='card')&&onMe){const col=z==='set'?x:(g.props[me].find(y=>y.id===+x)||{}).color;if(validColor(c,col))return commit({t:'prop',card:id,color:col});}
    return ask();
  }
  if(c.k==='money'||(z==='bank'&&onMe))return commit({t:'bank',card:id});
  const a=c.act,canDbl=3-g.plays>=2&&g.hands[me].some(i=>CARDS[i].act==='double');
  if(c.k==='rent'){
    const owned=(c.sets||Object.keys(SETS)).filter(s=>count(g,me,s));
    if(owned.length===1&&!canDbl&&(c.sets||target))return play({color:owned[0],target:target});
    return ask(target?{target:target}:{});
  }
  if(a==='house'||a==='hotel'){
    const ok=complete(g,me).filter(s=>!g.ups[me].some(u=>u.color===s&&CARDS[u.id].act===a));
    if(z==='set'&&onMe&&ok.includes(x))return play({color:x});
    return ok.length===1?play({color:ok[0]}):ask();
  }
  if(a==='draw'||a==='bday')return play({});
  if(a==='debt'||a==='peek'||a==='nodraw'||a==='redraw')return target?play({target:target}):ask();
  const theirs=target&&z==='card'?g.props[target].find(y=>y.id===+x):null;
  if(a==='sly')return theirs&&stealable(g,target).includes(theirs)?play({target:target,take:theirs.id}):ask(target?{target:target}:{});
  if(a==='breaker'){const col=z==='set'?x:theirs?theirs.color:null;return target&&col&&complete(g,target).includes(col)?play({target:target,color:col}):ask(target?{target:target}:{});}
  if(a==='swap')return theirs&&stealable(g,target).includes(theirs)?ask({target:target,take:{p:target,x:theirs}}):ask(target?{target:target}:{});
  ask(target?{target:target}:{});
}
function moveWild(id,drop){
  const g=game,c=CARDS[id],cur=(g.props[me].find(y=>y.id===id)||{}).color,d=drop.split(':'),z=d[0],x=d[2];
  if(!cur)return;
  if(d[1]&&d[1]!==me)return flash('Wild cards can only move between your own sets.');
  let col=z==='set'?x:z==='card'?(g.props[me].find(y=>y.id===+x)||{}).color:null;
  if(col===cur)col=null;
  if(col&&!validColor(c,col))return flash('That wild card only fits '+SETS[c.sets[0]].n+' or '+SETS[c.sets[1]].n+'.');
  if(!col&&c.sets)col=c.sets[0]===cur?c.sets[1]:c.sets[0];
  if(col)return commit({t:'recolor',card:id,color:col});
  ui.sel=null;ui.recolor=id;render();
}
let drag=null,skipClick=false;
const zoneAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e?e.closest('[data-drop]'):null;};
function dragEnd(){
  if(!drag)return;clearInterval(drag.timer);
  if(drag.ghost){drag.ghost.remove();document.body.classList.remove('dragging');}
  document.querySelectorAll('.over,.lifting').forEach(e=>e.classList.remove('over','lifting'));drag=null;
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el||e.button>0)return;
  dragEnd();drag={id:el.dataset.drag,el:el,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,ghost:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.ghost){
    if(Math.hypot(drag.x-drag.x0,drag.y-drag.y0)<10)return;
    const r=drag.el.getBoundingClientRect(),gh=drag.el.cloneNode(true);
    gh.classList.add('ghost');gh.classList.remove('sel');gh.removeAttribute('data-h');gh.removeAttribute('data-drag');gh.style.width=r.width+'px';
    document.body.appendChild(gh);drag.ghost=gh;drag.w=r.width;drag.h=r.height;drag.el.classList.add('lifting');document.body.classList.add('dragging');
    // scroll the page when the card is held near the top, or just above the hand
    drag.timer=setInterval(()=>{const bar=document.querySelector('.handbar'),low=(bar?bar.getBoundingClientRect().top:innerHeight)-30;
      if(drag.y<70)scrollBy(0,-14);else if(drag.y>low&&drag.y<low+60)scrollBy(0,14);},16);
  }
  drag.ghost.style.transform='translate('+(drag.x-drag.w/2)+'px,'+(drag.y-drag.h*.7)+'px) rotate(3deg)';
  const z=zoneAt(drag.x,drag.y);
  document.querySelectorAll('.over').forEach(o=>{if(o!==z)o.classList.remove('over');});
  if(z)z.classList.add('over');
});
document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const moved=!!drag.ghost,id=drag.id,z=moved?zoneAt(e.clientX,e.clientY):null;
  dragEnd();
  if(moved){skipClick=true;setTimeout(()=>{skipClick=false;},60);if(z){if(id[0]==='w')moveWild(+id.slice(1),z.dataset.drop);else dropCard(+id,z.dataset.drop);}}
});
document.addEventListener('pointercancel',dragEnd);
function peekHTML(g){
  if(!g.peek||g.peek.by!==me)return '';
  if(g.peek.n!==ui.peekN){ui.peekN=g.peek.n;ui.peekUntil=Date.now()+10000;setTimeout(render,10100);}
  if(Date.now()>=ui.peekUntil)return '';
  return '<div class="panel turn"><h2>'+esc(pname(g,g.peek.target))+"'s hand · closes in 10 seconds</h2><div class=\"hand\">"+g.hands[g.peek.target].map(i=>cardHTML(i,{sm:true})).join('')+'</div></div>';
}
function render(){
  handlers=[];
  if(game&&game.status!=='lobby'&&game.v!==ui.v){ui.v=game.v;resetSel();}
  const h0=document.querySelector('.handbar .hand'),sx=h0?h0.scrollLeft:0;
  $app.innerHTML=!code||!game?vHome():game.status==='lobby'?vLobby():vTable();
  const h1=document.querySelector('.handbar .hand');if(h1)h1.scrollLeft=sx;
}
document.addEventListener('click',e=>{if(skipClick)return;const b=e.target.closest('[data-h]');if(b&&!b.disabled&&handlers[b.dataset.h])handlers[b.dataset.h]();});
document.addEventListener('input',e=>{
  if(e.target.id==='f-name'){ui.name=e.target.value;store.set('qd_name',ui.name);}
  if(e.target.id==='f-code')ui.join=e.target.value;
});

const SAVE_ERR='That did not save. If it keeps happening you may only have view access: ask the person who shared this page to invite you as an editor.';
const gameRef=()=>db.doc('games/'+code);
async function commit(a){
  if(ui.busy||!game)return;
  const g=JSON.parse(JSON.stringify(game)),err=act(g,me,a);
  if(err)return flash(err);
  g.v=(g.v||0)+1;ui.busy=true;ui.msg='';
  try{await gameRef().set(g);game=g;}catch(e){ui.msg=SAVE_ERR;}
  ui.busy=false;render();
}
function myName(){const n=ui.name.trim().slice(0,16);if(!n)flash('Type a name first.');return n;}
function watch(){
  unsubs.push(gameRef().onSnapshot(s=>{game=s.exists?s.data():null;if(!game){leaveTable(true);return;}
    if(game.status==='lobby'&&!seats.some(x=>x.id===me))sit();render();},()=>flash('Lost the connection to this table. Reload the page.')));
  unsubs.push(gameRef().collection('seats').onSnapshot(q=>{seats=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>a.at-b.at);render();},()=>{}));
}
let sitting=false;
async function sit(){
  if(sitting)return;sitting=true;
  try{await gameRef().collection('seats').doc(me).set({name:ui.name.trim().slice(0,16)||'Player',at:Date.now()});}catch(e){ui.msg=SAVE_ERR;render();}
  sitting=false;
}
async function createTable(){
  if(!myName()||ui.busy)return;ui.busy=true;ui.msg='';render();
  try{
    let c='';for(let tries=0;tries<5;tries++){c='';for(let i=0;i<4;i++)c+='ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)];
      if(!(await db.doc('games/'+c).get()).exists)break;}
    code=c;await gameRef().set({status:'lobby',host:me,v:0});
    game={status:'lobby',host:me,v:0};seats=[];store.set('qd_code',code);await sit();watch();
  }catch(e){code=null;game=null;ui.msg=SAVE_ERR;}
  ui.busy=false;render();
}
async function joinTable(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4)return flash('Table codes are 4 letters.');
  if(!myName()||ui.busy)return;ui.busy=true;ui.msg='';render();
  try{
    const s=await db.doc('games/'+c).get();
    if(!s.exists)ui.msg='There is no table '+c+'. Check the code with your host.';
    else{code=c;game=s.data();seats=[];store.set('qd_code',code);watch();}
  }catch(e){ui.msg='Could not reach that table. Try again.';}
  ui.busy=false;render();
}
function leaveTable(silent){
  unsubs.forEach(u=>u());unsubs=[];
  if(silent!==true&&game&&game.status==='lobby'&&db)gameRef().collection('seats').doc(me).delete().catch(()=>{});
  code=null;game=null;seats=[];ui.join='';ui.msg='';ui.v=-1;resetSel();store.set('qd_code','');render();
}
async function startGame(){
  if(ui.busy||seats.length<2)return;ui.busy=true;
  const g=newGame(seats.slice(0,5).map(s=>({id:s.id,name:String(s.name||'Player').slice(0,16)})),me);
  try{await gameRef().set(g);game=g;}catch(e){ui.msg=SAVE_ERR;}
  ui.busy=false;render();
}
async function againGame(){
  try{await gameRef().set({status:'lobby',host:game.host,v:(game.v||0)+1});}catch(e){flash(SAVE_ERR);}
}
(async function boot(){
  ui.name=store.get('qd_name')||'';
  ui.join=(location.hash||'').replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||store.get('qd_code')||'';
  render();
  const c=window.claude;
  if(!c||!c.use){ui.nodb=true;return render();}
  const r=await Promise.all([c.use('db'),c.use('user')]);
  db=r[0];if(!db){ui.nodb=true;return render();}
  let id=r[1]?await r[1].id():null;
  if(!id){id=store.get('qd_pid');if(!id){id='g'+Math.random().toString(36).slice(2,12);store.set('qd_pid',id);}}
  me=id;ui.ready=true;render();
})();
</script>
